<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-labelledby="title desc">
  <title id="title">Impulsive logo</title>
  <desc id="desc">Three soft interwoven loops forming the Impulsive mark.</desc>
  <defs>
    <linearGradient id="loop-blue" x1="278" y1="14" x2="176" y2="299" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EC5FF"/>
      <stop offset="1" stop-color="#BDE0FE"/>
    </linearGradient>
    <linearGradient id="loop-lemon" x1="183" y1="143" x2="397" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4B8"/>
      <stop offset="1" stop-color="#F5D765"/>
    </linearGradient>
    <linearGradient id="loop-lilac" x1="300" y1="222" x2="45" y2="356" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFAFEA"/>
      <stop offset="1" stop-color="#E0D7FF"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2D2730" flood-opacity="0.14"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow)">
    <path d="M255 28c57 16 88 62 82 125-6 62-42 136-95 199" stroke="url(#loop-blue)" stroke-width="56"/>
    <path d="M180 170c83-9 166 10 210 55 44 46 33 106-12 133-43 27-105 14-150-30" stroke="url(#loop-lemon)" stroke-width="56"/>
    <path d="M284 221c-46 101-116 158-184 146-57-10-83-62-54-110 22-37 62-59 115-73" stroke="url(#loop-lilac)" stroke-width="56"/>
  </g>
  <g fill="none" stroke="#2D2730" stroke-linecap="round" stroke-linejoin="round" opacity="0.18">
    <path d="M255 28c57 16 88 62 82 125-6 62-42 136-95 199" stroke-width="12"/>
    <path d="M180 170c83-9 166 10 210 55 44 46 33 106-12 133-43 27-105 14-150-30" stroke-width="12"/>
    <path d="M284 221c-46 101-116 158-184 146-57-10-83-62-54-110 22-37 62-59 115-73" stroke-width="12"/>
  </g>
</svg>
