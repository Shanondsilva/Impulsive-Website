  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does Impulsive actually do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Impulsive is a behaviour-change app designed for the moment a habit loop accelerates. When a trigger starts, it gives you structured tools to pause and redirect — breathing patterns, body-focused grounding, short recovery games, and a calm reflection log. Between sessions it shows patterns over time so you can understand your own loop more clearly."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data private?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Your patterns, triggers, and reflections are designed to stay on your device by default. We do not sell your data and we do not use advertising trackers. Any future backup or sync feature would be optional, opt-in, and clearly explained before use — never enabled by default."
          }
        },
        {
          "@type": "Question",
          "name": "Is Impulsive a replacement for therapy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Impulsive is a behaviour-change support tool, not therapy, diagnosis, or clinical treatment. It is designed to sit alongside professional support. If you are in crisis or need clinical care, please contact your GP, a qualified therapist, or the Samaritans on 116 123."
          }
        },
        {
          "@type": "Question",
          "name": "What is the waitlist for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Impulsive is in development and launching to a small group first. The waitlist lets us notify you when access opens. We are not collecting email addresses to send marketing. You will hear from us when the app is ready for you."
          }
        }
      ]
    }
  </script>
