# Secrets
# Never put secret values in this file.
# Set these using Wrangler:
#   npx wrangler secret put BREVO_API_KEY
#   npx wrangler secret put WAITLIST_IP_HASH_SECRET
#   npx wrangler secret put FIREBASE_DELETE_URL
#   npx wrangler secret put FIREBASE_DELETE_SECRET
#
# Plain variables are safe to keep in [vars].

name = "steep-cake-9a73"
main = "src/worker.js"
compatibility_date = "2026-05-03"
compatibility_flags = ["nodejs_compat"]

[vars]
WAITLIST_FROM_EMAIL = "hello@useimpulsive.com"
WAITLIST_FROM_NAME = "Impulsive"
WAITLIST_REPLY_TO_EMAIL = "hello@useimpulsive.com"

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "impulsive_waitlist"
database_id = "d43a695f-856f-412f-848c-3afc6241ccc9"

[[routes]]
pattern = "useimpulsive.com"
custom_domain = true
zone_name = "useimpulsive.com"
enabled = true
previews_enabled = false

[[routes]]
pattern = "www.useimpulsive.com"
custom_domain = true
zone_name = "useimpulsive.com"
enabled = true
previews_enabled = false
